      text-decoration: none !important;

<body class="webtimer-standalone-body" data-phase="focus">
  <!-- Dynamic Phase Ambient Glows -->
  <div class="focus-ambient-glow focus-glow-center" aria-hidden="true"></div>
  <div class="focus-ambient-glow focus-glow-top" aria-hidden="true"></div>

  <!-- Top Bar -->
  <header class="focus-top-bar" role="banner">
    <a href="./" class="focus-brand" title="Back to PomodoroX Homepage" aria-label="PomodoroX Home">
      <img src="assets/app_icon.png" alt="PomodoroX Logo" class="focus-brand-img" width="28" height="28">
      <span>Pomodoro<span>X</span> <span style="color:var(--text-muted);font-weight:500;font-size:13px;">• WebTimer</span></span>
    </a>

    <div class="focus-top-actions">
      <button type="button" class="focus-pill-btn" onclick="shareWebTimerLink(event)" title="Copy direct link to WebTimer" aria-label="Share WebTimer Link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>Share Link</span>
      </button>
      <button type="button" class="focus-icon-btn" onclick="toggleBrowserFullscreen()" title="Toggle Fullscreen (F)" aria-label="Toggle Fullscreen">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <a href="./" class="focus-icon-btn" title="Back to Home" aria-label="Back to Homepage">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
    </div>
  </header>

  <!-- Center Focus Stage -->
  <main class="focus-stage" role="main">
    <!-- Active Task Banner -->
    <div class="focus-task-card glass-card">
      <div class="focus-task-info">
        <span class="focus-task-emoji">💻</span>
        <div>
          <div class="focus-task-title" id="activeTaskName" contenteditable="true" spellcheck="false" title="Click to rename task">Deep Focus Sprint</div>
          <div class="focus-task-cycle">Pomodoros completed: <span id="pomoCount">0</span>/4</div>
        </div>
      </div>
      <span class="focus-task-status">Web Live</span>
    </div>

    <!-- Phase Selector -->
    <div class="phase-selector" role="tablist" aria-label="Timer Phase Selector">
      <button class="phase-pill active" role="tab" aria-selected="true" onclick="setDemoPhase('focus')">Focus (25m)</button>
      <button class="phase-pill" role="tab" aria-selected="false" onclick="setDemoPhase('shortBreak')">Short Break (5m)</button>
      <button class="phase-pill" role="tab" aria-selected="false" onclick="setDemoPhase('longBreak')">Long Break (15m)</button>
    </div>

    <!-- Circular Glowing Canvas Ring -->
    <div class="focus-dial-wrapper">
      <canvas id="timerCanvas" width="320" height="320" class="focus-dial-canvas" aria-label="Focus Dial Canvas"></canvas>
      <div class="focus-display-overlay">
        <div class="focus-phase-tag" id="phaseTag">FOCUS</div>
        <div class="focus-timer-time" id="timerTime" aria-live="polite">25:00</div>
        <div class="focus-timer-adjusters">
          <button class="focus-adj-btn" onclick="adjustDemoTime(-5)" aria-label="Subtract 5 minutes">-5m</button>
          <button class="focus-adj-btn" onclick="adjustDemoTime(5)" aria-label="Add 5 minutes">+5m</button>
        </div>
      </div>
    </div>

    <div class="focus-cycle-indicator" id="cycleIndicator">Session #1 of 4 • Distraction-Free Flow</div>

    <!-- Play / Pause Controls -->
    <div class="focus-control-row">
      <button class="focus-ctrl-btn focus-sub-btn" onclick="resetDemoTimer()" title="Reset Session (R)" aria-label="Reset Timer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="focus-ctrl-btn focus-main-play-btn" id="playBtn" onclick="toggleDemoTimer()" title="Start / Pause (Space)" aria-label="Start or Pause Timer">
        <svg id="playIcon" width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
      </button>
      <button class="focus-ctrl-btn focus-sub-btn" onclick="skipDemoPhase()" title="Skip Phase (S)" aria-label="Skip to Next Phase">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line></svg>
      </button>
    </div>

    <!-- Ambient Sound Bar -->
    <div class="focus-ambient-bar glass-card">
      <div class="ambient-picker">
        <span class="ambient-icon" id="ambientIcon">🌊</span>
        <select id="ambientSelect" onchange="changeAmbientSound(this.value)" aria-label="Select Ambient Soundscape">
          <option value="none">Ambient: Off</option>
          <option value="oceanWaves">Real Ocean Waves</option>
          <option value="pinkNoise">Deep Pink Noise</option>
          <option value="brownNoise">Brown Noise</option>
          <option value="stream">Forest Stream</option>
        </select>
      </div>
      <input type="range" id="ambientVol" min="0" max="1" step="0.05" value="0.5" oninput="setAmbientVolume(this.value)" aria-label="Ambient Volume">
    </div>
  </main>

  <!-- Footer Shortcuts & App Links -->
  <footer class="focus-footer-bar" role="contentinfo">
    <div class="focus-shortcuts-pill">
      <span><kbd>Space</kbd> Play/Pause</span>
      <span><kbd>F</kbd> Fullscreen</span>
      <span><kbd>R</kbd> Reset</span>
      <span><kbd>S</kbd> Skip</span>
    </div>

    <a href="./#download" class="focus-footer-cta" title="Get native macOS and iOS apps">
      <span>Need MenuBarExtra or Swift Charts? Get macOS App →</span>
    </a>
  </footer>

  <script src="app.js?v=1.0.3"></script>
</body>
</html>

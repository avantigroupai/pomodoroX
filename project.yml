name: PomodoroX
options:
  bundleIdPrefix: com.pomodorox

settings:
  SWIFT_VERSION: "5.9"
  GENERATE_INFOPLIST_FILE: YES
  ENABLE_USER_SCRIPT_SANDBOXING: NO
  CODE_SIGNING_ALLOWED: NO
  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  PomodoroXCore-macOS:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/PomodoroXCore
    settings:
      PRODUCT_NAME: PomodoroXCore
      PRODUCT_MODULE_NAME: PomodoroXCore
      DEFINES_MODULE: YES

  PomodoroXCore-iOS:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/PomodoroXCore
    settings:
      PRODUCT_NAME: PomodoroXCore
      PRODUCT_MODULE_NAME: PomodoroXCore
      DEFINES_MODULE: YES

  PomodoroX-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/PomodoroXApp
        excludes:
          - "Info-*.plist"
    dependencies:
      - target: PomodoroXCore-macOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pomodorox.app
      PRODUCT_NAME: PomodoroX
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleIconFile: AppIcon
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_KEY_LSUIElement: NO
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 PomodoroX. All rights reserved."

  PomodoroX-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PomodoroXApp
        excludes:
          - "Info-*.plist"
    dependencies:
      - target: PomodoroXCore-iOS
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.pomodorox.ios
      PRODUCT_NAME: PomodoroX
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_KEY_UILaunchScreen_Generation: YES

  PomodoroXTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/PomodoroXCoreTests
    dependencies:
      - target: PomodoroXCore-macOS
